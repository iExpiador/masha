<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MashaDollk ✦ Space</title>
    <!-- Font Awesome 6 (iconos sutiles) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Fondo suave, oscuro pero con tonos café-rosado, nada agresivo */
            background: radial-gradient(circle at 50% 30%, #1e1826, #0e0b14);
            font-family: 'Segoe UI', 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        /* Contenedor principal: amplio, con cristal y borde rosa pálido */
        .space-container {
            max-width: 1100px;
            width: 100%;
            background: rgba(25, 20, 35, 0.55);
            backdrop-filter: blur(16px);
            border-radius: 3rem;
            padding: 2rem 2rem 2rem 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 200, 230, 0.3), 0 0 25px rgba(255, 120, 180, 0.2);
            transition: all 0.3s;
            border: 1px solid rgba(255, 180, 210, 0.5);
        }

        /* Header: avatar y nombre con degradado rosa */
        .profile-header {
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            align-items: center;
            margin-bottom: 2.2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 160, 200, 0.5);
        }

        .avatar-frame img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #ffb7d2;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2), 0 0 0 3px rgba(255, 140, 180, 0.3);
            background: #2a1e30;
        }

        .title-info h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FFB7D2, #FF85B3, #FF5E9E);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            text-shadow: 0 2px 10px rgba(255, 100, 150, 0.2);
        }

        .subtle-badge {
            background: rgba(255, 200, 220, 0.2);
            border-radius: 50px;
            padding: 0.2rem 1rem;
            font-size: 0.8rem;
            display: inline-block;
            margin-top: 0.5rem;
            color: #ffe2f0;
            border: 0.5px solid #ffb7d2;
        }

        /* ZONA CENTRAL: LA IMAGEN PRINCIPAL (ocupa el foco) */
        .hero-image {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 2.2rem;
            padding: 1rem;
            margin: 1rem 0 2rem 0;
            text-align: center;
            border: 1px solid rgba(255, 170, 200, 0.6);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(255, 200, 220, 0.1);
        }

        .hero-image img {
            max-width: 100%;
            max-height: 550px;
            width: auto;
            border-radius: 1.6rem;
            display: block;
            margin: 0 auto;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }

        .hero-image img:hover {
            transform: scale(1.01);
        }

        /* Sección de redes sociales (botones finos, elegantes, sin colores estridentes) */
        .social-section {
            margin-top: 1rem;
            text-align: center;
        }

        .social-section h3 {
            font-size: 1.3rem;
            font-weight: 400;
            margin-bottom: 1.3rem;
            color: #ffcce5;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px dashed #ff99c2;
            padding-bottom: 5px;
        }

        .social-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-top: 0.8rem;
        }

        .social-btn {
            background: rgba(30, 20, 40, 0.6);
            backdrop-filter: blur(5px);
            border-radius: 50px;
            padding: 0.7rem 1.4rem;
            font-size: 1rem;
            font-weight: 500;
            color: #fff0f5;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s ease;
            border: 1px solid #ffb7d2;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .social-btn i {
            font-size: 1.3rem;
            color: #ffb3d0;
        }

        .social-btn:hover {
            background: rgba(255, 180, 210, 0.2);
            border-color: #ff99cc;
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(255, 100, 150, 0.2);
            color: white;
        }

        .footer-note {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 0.7rem;
            color: #b692ae;
            border-top: 1px solid rgba(255, 160, 200, 0.3);
            padding-top: 1.2rem;
        }

        @media (max-width: 700px) {
            body { padding: 1rem; }
            .space-container { padding: 1.2rem; }
            .title-info h1 { font-size: 2rem; }
            .profile-header { justify-content: center; text-align: center; flex-direction: column; }
            .social-btn { padding: 0.5rem 1rem; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="space-container">

    <div class="profile-header">
        <div class="avatar-frame">
            
            <img src="https://xatimg.com/image/2itafBilcutf.gif" alt="MashaDoll">
        </div>
        <div class="title-info">
            <h1>𝑴𝒂𝒔𝒉𝒂𝒅𝒐𝒍𝒍</h1>
            <div class="subtle-badge">
                <i class="fas fa-heart"></i> Marie Joliet · Wiz/Marita

       <div class="hero-image">

        <!-- Si aún no la tienes online, súbela a Imgur o a GitHub y pega el enlace aquí -->
    </div>

    <!-- REDES SOCIALES -->
    <div class="social-section">
        <h3><i class="fas fa-heart"></i> SIGUEME EN LAS REDES :v <i class="fas fa-heart"></i></h3>
        <div class="social-buttons">
            <a href="#" class="social-btn"><i class="fab fa-instagram"></i> Instagram</a>

    </div>

    <div class="footer-note">
        TEXTO DE RELLENO QUE VIVA EL ROCK PUTOS
    </div>
</div>

</html>
