<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masha - Space</title>
  <style>
    :root {
      /* --- CONFIGURACIÓN DE DIMENSIONES --- */
      --btn-width: 290px;
      --btn-height: 190px;
      /* --- MUOVER Y ROTAR BOTONES --- */
      --p1-x: -397px;
      --p1-y: -280px;
      --p1-r: -15deg;
      --p2-x: -427px;
      --p2-y: -195px;
      --p2-r: -6deg;
      --p3-x: -427px;
      --p3-y: -95px;
      --p3-r: 0deg;
      --p4-x: -417px;
      --p4-y: -5px;
      --p4-r: 2deg;
      --p5-x: -387px;
      --p5-y: 85px;
      --p5-r: 7deg;
      /* --- MODIFICA MINI BOTÓN "SPECIAL" AQUÍ --- */
      --p6-x: -225px;
      /* Posicionado sobre KLIN */
      --p6-y: -255px;
      /* Altura sobre el abanico */
      --p6-r: 22deg;
      /* ROTACIÓN DEL BOTÓN SPECIAL */
      --p6-width: 80px;
      --p6-height: 35px;
      --p6-font-size: 13px;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: 'Segoe UI', sans-serif;
    }

    .animated-background {
      position: fixed;
      width: 100%;
      height: 100%;
      background: url('https://xatimg.com/image/U5aaY3dgCPVx.png') repeat;
      background-size: 300px;
      animation: moveOblique 40s linear infinite;
      z-index: 1;
    }

    .main-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 40px;
    }

    .kashima-container {
      position: relative;
      width: 450px;
      height: 450px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .buttons-layer {
      position: absolute;
      z-index: 25;
      pointer-events: none;
      width: 1px;
      height: 1px;
    }

    .nav-button {
      position: absolute;
      width: var(--btn-width);
      height: var(--btn-height);
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      background-color: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      opacity: 0;
      pointer-events: auto;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.1), opacity 0.3s;
      transform: translate(-50%, -50%) scale(0.1);
      left: 0;
      top: 0;
    }

    .kashima-container:hover .nav-button {
      opacity: 1;
    }

    .btn-1 {
      background-image: url('https://xatimg.com/image/zku00w5fBTCF.png');
    }

    .kashima-container:hover .btn-1 {
      transform: translate(var(--p1-x), var(--p1-y)) rotate(var(--p1-r)) scale(1);
    }

    .btn-1:hover {
      transform: translate(var(--p1-x), var(--p1-y)) rotate(var(--p1-r)) scale(1.1) !important;
      filter: brightness(1.3) drop-shadow(0 0 15px #7b4db9);
    }

    .btn-2 {
      background-image: url('https://xatimg.com/image/ERUvniEyz2dp.png');
    }

    .kashima-container:hover .btn-2 {
      transform: translate(var(--p2-x), var(--p2-y)) rotate(var(--p2-r)) scale(1);
    }

    .btn-2:hover {
      transform: translate(var(--p2-x), var(--p2-y)) rotate(var(--p2-r)) scale(1.1) !important;
      filter: brightness(1.3) drop-shadow(0 0 15px #7b4db9);
    }

    .btn-3 {
      background-image: url('https://xatimg.com/image/9d9diHaDreXZ.png');
    }

    .kashima-container:hover .btn-3 {
      transform: translate(var(--p3-x), var(--p3-y)) rotate(var(--p3-r)) scale(1);
    }

    .btn-3:hover {
      transform: translate(var(--p3-x), var(--p3-y)) rotate(var(--p3-r)) scale(1.1) !important;
      filter: brightness(1.3) drop-shadow(0 0 15px #7b4db9);
    }

    .btn-4 {
      background-image: url('https://xatimg.com/image/gyE82ZUYATUl.png');
    }

    .kashima-container:hover .btn-4 {
      transform: translate(var(--p4-x), var(--p4-y)) rotate(var(--p4-r)) scale(1);
    }

    .btn-4:hover {
      transform: translate(var(--p4-x), var(--p4-y)) rotate(var(--p4-r)) scale(1.1) !important;
      filter: brightness(1.3) drop-shadow(0 0 15px #7b4db9);
    }

    .btn-5 {
      background-image: url('https://i.imgur.com/kD1wnPn.png');
    }

    .kashima-container:hover .btn-5 {
      transform: translate(var(--p5-x), var(--p5-y)) rotate(var(--p5-r)) scale(1);
    }

    .btn-5:hover {
      transform: translate(var(--p5-x), var(--p5-y)) rotate(var(--p5-r)) scale(1.1) !important;
      filter: brightness(1.3) drop-shadow(0 0 15px #7b4db9);
    }

    .btn-special {
      width: var(--p6-width) !important;
      height: var(--p6-height) !important;
      background-color: #7b4db9 !important;
      color: white !important;
      border-radius: 8px;
      font-weight: bold;
      font-size: var(--p6-font-size);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid white !important;
      z-index: 110 !important;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: auto;
    }

    .kashima-container:hover .btn-special {
      opacity: 1;
      transform: translate(var(--p6-x), var(--p6-y)) rotate(var(--p6-r)) scale(1);
    }

    .btn-special:hover {
      filter: brightness(1.4) !important;
      transform: translate(var(--p6-x), var(--p6-y)) rotate(var(--p6-r)) scale(1.1) !important;
      cursor: pointer;
    }

    .text-window {
      position: absolute;
      top: 50px;
      left: 110%;
      width: 450px;
      height: 380px;
      background: rgba(10, 10, 10, 0.96);
      border: 2px solid #7b4db9;
      border-radius: 15px;
      z-index: 100;
      padding: 20px;
      display: none;
      color: white;
      box-shadow: 0 0 30px black;
    }

    #popupBody {
      height: 90%;
      margin-top: 15px;
      overflow-y: auto;
      padding-right: 5px;
    }

    #popupBody::-webkit-scrollbar {
      width: 5px;
    }

    #popupBody::-webkit-scrollbar-thumb {
      background: #7b4db9;
      border-radius: 10px;
    }

    .image-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      display: none;
    }

    .gallery-item {
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #7b4db9;
    }

    .gallery-item img {
      width: 100%;
      height: auto;
      object-fit: contain;
      border-radius: 5px;
      margin-bottom: 8px;
    }

    .gallery-item p {
      margin: 0;
      font-size: 13px;
      color: #ddd;
      line-height: 1.2;
    }

    #popupText {
      width: 100%;
      height: 90%;
      background: transparent;
      border: none;
      color: white;
      outline: none;
      font-size: 16px;
      resize: none;
      display: none;
    }

    /* Estilo especial para la sección "My" (cuadro centrado) */
    .single-profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }
    .single-profile img {
      max-width: 250px;
      width: 80%;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 2px solid #7b4db9;
      box-shadow: 0 0 15px rgba(123, 77, 185, 0.5);
    }
    .single-profile .description {
      font-size: 15px;
      line-height: 1.5;
      color: #f0f0f0;
      background: rgba(0,0,0,0.5);
      padding: 12px 20px;
      border-radius: 20px;
      max-width: 90%;
      white-space: pre-line;
    }
    .single-profile .description strong {
      color: #7b4db9;
    }

    /* REPRODUCTOR REPOSICIONADO: debajo de la imagen derecha */
    .music-player-container {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.8);
      padding: 10px;
      border-radius: 50px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    audio {
      height: 30px;
      filter: invert(36%) sepia(88%) saturate(913%) hue-rotate(227deg) brightness(87%) contrast(87%);
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      cursor: pointer;
      color: #7b4db9;
      font-size: 24px;
    }

    .cloud-rotator {
      position: absolute;
      z-index: 5;
      pointer-events: none;
    }

    .rot-cw {
      animation: rotateSimpleCW 30s linear infinite;
    }

    .rot-ccw {
      animation: rotateSimpleCCW 35s linear infinite;
    }

    .pulse {
      animation: pulseA 2s ease-in-out infinite;
      width: 640px;
      opacity: 0.9;
    }

    .circle-layer {
      position: absolute;
      z-index: 10;
      width: 550px;
      animation: rotateSimpleCW 1s linear infinite;
      pointer-events: none;
    }

    .img-front {
      position: absolute;
      z-index: 30;
      width: 600px;
      pointer-events: none;
    }

    .img-right {
      width: 550px;
      height: auto;
      display: block;
    }

    @keyframes pulseA {

      0%,
      100% {
        transform: scale(0.8);
      }

      50% {
        transform: scale(1.1);
      }
    }

    @keyframes rotateSimpleCW {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes rotateSimpleCCW {
      from {
        transform: rotate(360deg);
      }

      to {
        transform: rotate(0deg);
      }
    }

    @keyframes moveOblique {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 1000px 1000px;
      }
    }

    /* Ajuste para que el contenedor de la imagen derecha también agrupe el reproductor */
    .new-image-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>

<body onclick="startAudio()">

        <button class="nav-button btn-1" onclick="openWindow('My', 'forno')"></button>

        <button class="nav-button btn-3" onclick="openWindow('Masks', 'maschere')"></button>
        <button class="nav-button btn-4" onclick="openWindow('Incense', 'incensi')"></button>
        <button class="nav-button btn-5" onclick="openWindow('Rituals', 'rituali')"></button>
        <button class="nav-button btn-special" onclick="openWindow('Limited', 'altre_offerte')">LIMITED</button>
      </div>

      <div id="popupWindow" class="text-window">
        <span class="close-btn" onclick="closeWindow()">&times;</span>
        <h3 id="popupTitle" style="margin:0; color:#7b4db9; border-bottom: 1px solid #7b4db9;">TITOLO</h3>
        <div id="popupBody">
          <div id="imageGrid" class="image-grid"></div>
          <textarea id="popupText" placeholder="coming soon..."></textarea>
        </div>
      </div>

      <div class="cloud-rotator rot-cw"><img src="https://xatimg.com/image/K3WCfRZ4rb0k.png" class="pulse"></div>
      <div class="cloud-rotator rot-ccw"><img src="https://xatimg.com/image/Dv4Y4bNjNWnY.png" class="pulse"></div>
      <img src="https://xatimg.com/image/PznN7Stpz8yh.png" class="circle-layer">
      <img src="https://xatimg.com/image/7pygkjSxrcQ1.png" class="img-front">
    </div>
    <div class="new-image-container">
      <img src="https://xatimg.com/image/L8bLBDbccdhP.png" class="img-right">
      <!-- Reproductor reposicionado justo debajo de la imagen derecha -->

  </div>

    function startAudio() {
      var audio = document.getElementById("myAudio");
      if (audio && audio.paused) {
        audio.play().catch(() => {});
      }
    }

    function openWindow(title, type) {
      const windowEl = document.getElementById('popupWindow');
      const imageGrid = document.getElementById('imageGrid');
      const popupText = document.getElementById('popupText');
      windowEl.style.display = 'block';
      document.getElementById('popupTitle').innerText = title;
      
      // CASO ESPECIAL: Rituals (textarea)
      if (type === 'rituali') {
        imageGrid.style.display = 'none';
        popupText.style.display = 'block';
        popupText.value = ''; // Limpiar por si acaso
        return;
      }
      
      // Para todos los demás casos, mostramos la cuadrícula de imágenes
      imageGrid.style.display = 'grid';
      popupText.style.display = 'none';
      
      // MODIFICACIÓN PARA "My" (forno): mostramos un diseño centrado especial
      if (type === 'forno') {
        // Limpiamos el grid y mostramos el contenido personalizado
        imageGrid.innerHTML = '';
        // Creamos un contenedor especial
        const specialDiv = document.createElement('div');
        specialDiv.className = 'single-profile';
        // Usamos la misma imagen de Marie (la primera del array)
        const marieImg = galleryData['forno'][0].img;
        // Texto descriptivo según la imagen proporcionada por el usuario
        const descriptionText = ``;
        specialDiv.innerHTML = `
  <img src="${marieImg}" alt="Marie">
  <div class="description">
    ${descriptionText.replace(/\n/g, '<br>')}
  </div>
`;
        imageGrid.appendChild(specialDiv);
        // Aseguramos que se vea como bloque flexible (el grid sigue siendo grid, pero este div ocupará toda la celda)
        // Para centrarlo bien, el grid tiene dos columnas, pero el div abarca ambas si usamos grid-column
        specialDiv.style.gridColumn = '1 / -1';
        return;
      }
      
      // Resto de galerías (gioielli, maschere, incensi, altre_offerte)
      let items = galleryData[type] || [];
      imageGrid.innerHTML = '';
      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'gallery-item';
        div.innerHTML = `<img src="${item.img}"><p>${item.text}</p>`;
        imageGrid.appendChild(div);
      });
    }

    function closeWindow() {
      document.getElementById('popupWindow').style.display = 'none';
    }
